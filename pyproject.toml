[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlogsrt"
version = "0.1.0"
description = "브이로그 자막 SRT 생성기 — whisper 골격 + gpt-transcribe 정본"
requires-python = ">=3.11"
dependencies = ["openai>=1.60", "tomli-w>=1.0", "rich>=13.7"]

[project.scripts]
vlogsrt = "vlogsrt.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
# 웹 UI는 선택 사항이다. 핵심 파이프라인은 여전히 의존성 3개로 돈다(불변 규칙 7).
ui = ["gradio>=6.0"]
# 파생 계층(vlogsrt/project/) 전용 런타임. 레거시 vlogsrt/*.py·ui/** 에서는
# import 자체가 금지다 — docs/PROJECT_CONTRACTS.md, scripts/check_invariants.py가 지킨다.
project = ["numpy>=2.0", "onnxruntime>=1.19"]

[tool.setuptools.packages.find]
include = ["vlogsrt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:vlogsrt.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
files = ["vlogsrt", "ui"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# 서드파티는 아예 따라가지 않는다. 그래야 `make check` 결과가
# site-packages에 무엇이 깔려 있는지에 흔들리지 않는다.
# (ui extra를 깔면 numpy 스텁이 딸려 오는데, 3.12 문법이라 3.11 설정으로는 파싱도 안 된다.)
no_site_packages = true

[[tool.mypy.overrides]]
module = ["openai.*", "rich.*", "tomli_w.*", "gradio.*", "numpy.*", "onnxruntime.*"]
ignore_missing_imports = true
