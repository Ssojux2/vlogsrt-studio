# 임시 진단 — 머지 전에 지운다. ffmpeg 9.1(choco 최신)에서 Windows 시험이 어디서 왜 멈추는지 본다.
name: diag-win-ffmpeg91

on:
  pull_request:

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VLOGSRT_OFFLINE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: choco install ffmpeg-full -y --no-progress
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,project,dev]"
      - run: ffmpeg -hide_banner -version
      - name: visual_review 시험 (멈추면 300초마다 모든 스레드의 스택)
        run: python -m pytest tests/raw/test_visual_review.py -v -o addopts="" -o faulthandler_timeout=300 --durations=20
