# 세 운영체제 검사(W-84, D144) — 오프라인(VLOGSRT_OFFLINE=1) · 비밀 값 없음 · 유료 호출 없음.
# macOS는 막는 게이트다. Windows·Linux는 처음 실행에서 무엇이 깨지는지 보고만 한다(continue-on-error) —
# 실패는 skip·xfail하지 않고 W-84a…로 나눠 고친 뒤 막는 쪽으로 올린다(docs/plans/2026-11-16-cross-platform.md).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      VLOGSRT_OFFLINE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg (Windows — gyan full 빌드에는 libass가 든다)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-tk

      - name: 꾸러미
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,project,dev]"

      - name: 작업대가 뜨는가
        run: python scripts/smoke_ui.py

      - name: 번인 ffmpeg(libass)
        shell: bash
        run: ffmpeg -hide_banner -filters | grep -E "^ ... subtitles " || echo "::warning::PATH ffmpeg에 libass(subtitles 필터)가 없다 — 번인 시험이 다른 후보를 찾는다"

      - name: 검사 전부 (make check와 같은 단계)
        run: python scripts/check_all.py
