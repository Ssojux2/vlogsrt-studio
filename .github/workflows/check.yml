# 세 운영체제 검사(W-84, D144) — 오프라인(VLOGSRT_OFFLINE=1) · 비밀 값 없음 · 유료 호출 없음.
# 세 운영체제 모두 막는 게이트다 — Windows·Linux는 보고만 하다가 W-84a로 다 초록이 된 뒤(2026-11-17,
# main c67c66e) 올렸다. 실패는 skip·xfail하지 않는다(docs/plans/2026-11-16-cross-platform.md).
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    env:
      VLOGSRT_OFFLINE: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # 판을 9.0.2로 못 박는다 — 소리 시각 시험(AAC 앞자리·원점 표)이 ffmpeg 9.0으로 잰 값이다(Linux와 같은
      # 까닭). 못 박지 않았을 때 choco가 9.1.0을 깔자(2026-11-21~) test_pcm 둘이 깨지고 시험 하나가 2시간
      # 한도까지 멈췄다 — 9.0.2였던 마지막 초록(53b5bf0)은 40분이었다.
      - name: ffmpeg (Windows — gyan full 빌드에는 libass가 든다)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full --version=9.0.2 -y --no-progress

      # xmllint(libxml2-utils)는 FCPXML 검증 문이다 — 없으면 Final Cut 보내기가 거부한다(W-84a).
      # zsh는 개발 엔진 설치 스크립트(`#!/bin/zsh`)의 셸이다. macOS는 둘 다 시스템에 있다.
      # ffmpeg는 배포판 것(6.x)이 아니라 9.0 정적 빌드다 — 소리 시각 시험(AAC 앞자리·원점 표)이
      # macOS brew의 ffmpeg 9.0으로 잰 값이라 다른 판(옛 판 · master)에서는 어긋난다. libass도 든다.
      - name: ffmpeg · xmllint · zsh (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y python3-tk libxml2-utils zsh
          curl -sSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-n9.0-latest-linux64-gpl-9.0/bin" >> "$GITHUB_PATH"

      - name: 꾸러미
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ui,project,dev]"

      - name: ffmpeg 판
        run: ffmpeg -hide_banner -version

      - name: 작업대가 뜨는가
        run: python scripts/smoke_ui.py

      - name: 번인 ffmpeg(libass)
        shell: bash
        run: ffmpeg -hide_banner -filters | grep -E "^ ... subtitles " || echo "::warning::PATH ffmpeg에 libass(subtitles 필터)가 없다 — 번인 시험이 다른 후보를 찾는다"

      - name: 검사 전부 (make check와 같은 단계)
        run: python scripts/check_all.py
