# 프로젝트 기본 설정. 프리셋과 CLI 옵션이 이 값을 덮어쓴다.
# 여기 없는 키는 vlogsrt/config.py 의 Config 기본값을 그대로 쓴다.

[transcribe]
language = "ko"

# 힌트는 회차마다 다르다. 화면에서 실행할 때마다 입력할 수 있으니 여기서는 비워둔다.
# 넣는다면 지시문이 아니라 **나올 법한 단어**를 적어라. 예: "망원동, 아페로, 코나"
#
# **이 값은 whisper에 가지 않는다**(불변 규칙 6). whisper는 prompt를 지시가 아니라
# 직전 자막 텍스트로 읽어서, 한 줄이 '한국 여행 브이로그' 138회·564초를 낳았다
# (D13, D16). 힌트는 검증 모델(`--verify`)로만 간다.
prompt = ""

# 모델은 세그먼트 시각을 주는 조합이어야 한다(D25).
#   transcribe_model = "whisper-1"
#   transcribe_format = "verbose_json"

# ── 검증 ────────────────────────────────────────────────────────────
# 같은 오디오를 gpt-transcribe로 한 번 더 받아 대조한다. **기본으로 켜져 있다.**
# 표시만 하므로 자막은 절대 안 바뀐다(규칙 5) — 대신 비용이 2배다.
# 끄려면 `vlogsrt run <video> --no-verify`.
#   verify_model = "gpt-transcribe"
#   verify_chunk_sim_floor = 0.80   # 이 아래면 자막이 발화를 놓쳤을 수 있다
#   verify_cue_match_floor = 0.60   # 이 아래인 큐를 '의심'으로 표시한다

# ── 온도 ────────────────────────────────────────────────────────────
# **되풀이를 막는 유일한 예방책이다(D28).** whisper는 30초 창의 디코딩 결과를 다음
# 창의 prompt로 넣는데(condition_on_previous_text), 그 글자가 되풀이면 다음 창도
# 되풀이다 — 되풀이가 번지는 통로가 그것 하나뿐이다. 레퍼런스 구현은 온도가 0.5를
# 넘으면 그 글자를 넘기지 않는다. 그래서 기본값이 0.6이다.
#
# 0으로 내리지 마라. 그게 greedy 디코딩이고 되풀이가 가장 잘 나는 설정이다.
# 대가는 비결정성이다 — 같은 영상이 실행마다 조금 다르게 나온다.
#   transcribe_temperature = 0.6

# ── 분할 ────────────────────────────────────────────────────────────
# **한도가 둘이고 작은 쪽이 이긴다(D27).**
#
# 바이트 한도는 모델이 받아주는 최대 입력이고, 초 한도는 whisper가 무너지지 않고
# 버티는 길이다. 둘은 다른 것을 막는다. 바이트만 보던 시절 24MB가 38분이 됐고,
# 그 길이에서 한 문장이 1668회·1658초 반복돼 영상의 41.4%를 먹었다(D26).
#
# **초 한도가 곧 되풀이가 자랄 수 있는 최대 길이다(D28).** 되풀이는 한 API 호출
# 안에서 창을 타고 번지므로 호출이 바뀌면 반드시 끊긴다 — 조각 경계가 유일한 강제
# 리셋이다. 600초였을 때 9.7분 조각 안에서 448초짜리 되풀이가 나왔다. 지금은 180초다.
# 요금이 분당이라 조각을 늘려도 총비용은 같다.
#   chunk_max_seconds = 180       # 코드 기본값. **올리지 마라**
#
# 바이트 한도를 여기서 덮어쓰던 줄은 지웠다(D28). 이제 초 한도가 언제나 먼저 걸려서
# (77분 영상: 초 26조각 vs 바이트 8조각) 남겨두면 "설정이 안 닿았나"를 두 곳에서
# 의심하게 된다. 조각을 3분보다 **더** 잘게 쪼갤 일이 생기면 그때 되살린다.
#
# 조각 경계는 목표 지점 ±5초에서 가장 조용한 곳으로 옮긴다. 조용한 곳이 없으면
# 목표에서 그냥 자른다 — 자리를 못 골라도 구간이 사라지지는 않는다(규칙 4).
#   cut_search_seconds = 5.0

# ── 되풀이 재전사 ───────────────────────────────────────────────────
# **기본으로 켜져 있고, 출력을 바꾸는 유일한 계층이다(D27).**
# 되풀이 구간을 조각 한도 안의 계획 여럿으로 쪼개 whisper에 더 뜨거운 온도로 다시
# 묻고, gpt-transcribe가 한 번 더 시도할 값어치를 판정한다.
# 끄려면 `vlogsrt run <video> --no-repair`.
#
# **검출 신호가 셋이다(D29)**: 연속 세그먼트가 글자 그대로 같은가(메아리), whisper의
# `compression_ratio`가 임계값을 넘는가(압축률), 세그먼트마다 글자가 하나뿐인 상태가
# 이어지는가(낱자). 셋째가 없던 시절 88초·44장이 전부 한 글자('S','F')였는데 검출이
# 아무것도 못 짚어 재전사가 한 번도 안 돌았다 — 앞의 둘이 1글자에 나란히 눈이 멀었다.
#
# 회복하지 못하면 **길이로 갈린다(D28)**: 긴 되풀이는 첫 장만 남기고 비우고
# (규칙 9의 유일한 예외), 짧은 되풀이는 1차 전사를 그대로 두고 경고만 남긴다.
# 사진 찍으며 아홉 번 말한 '치즈'까지 지울 이유는 없다.
#
# 되풀이가 없으면 API를 한 번도 부르지 않는다. 추가 비용은 되풀이 구간에만 붙는다.
#   repair_enabled = true
#   repair_temperature = 0.8          # 1차(0.6)보다 뜨겁고 0.5를 넘는다
#   repair_max_attempts = 2           # 심판이 "말이 있다"고 할 때만 두 번째를 산다
#   repair_chunk_seconds = 120        # **재전사도 조각 한도를 지킨다**(D28)
#   repair_margin = 2.0               # 재전사 구간 앞뒤 여유(초)
#   repair_min_seconds = 3.0          # 이보다 짧은 되풀이는 그냥 둔다
#   repair_residual_seconds = 10.0    # 회복본에 이만큼 넘게 남으면 불합격
#   repair_collapse_min_seconds = 30.0  # 이보다 짧으면 접지 않고 1차 전사를 남긴다
#   loop_compression_ratio = 2.4      # whisper 레퍼런스의 되풀이 임계값. 실측 분포도 여기서 갈렸다
#   loop_ratio_window_words = 60      # 압축률을 재는 창. **통째로 재면 길이 검사가 된다**
#   loop_repetitive_share = 0.5       # 비율 상한. **비율만으로는 못 잡는다**(D28)
#   loop_min_chars = 2                # 메아리와 낱자의 **경계선**. 위는 메아리, 아래는 낱자(D29)

[refine]
max_chars_per_line = 16
max_lines = 2
max_cps = 12.0

# ── 병합 ────────────────────────────────────────────────────────────
# 합칠 이유가 둘이고, 이유가 다르면 허용 폭도 다르다(D31).
#   깜빡임 없애기 — 앞 큐가 min_duration(0.85초)보다 짧다 → 두 줄(32자)까지 합친다
#   한 줄 채우기 — 그 밖의 모든 경우                      → 한 줄(16자)에서 멈춘다
# 둘 다 아래 간격 안쪽일 때만이다. 한 줄을 넘긴다는 것은 두 장으로 둘 이유가 있다는 뜻이다.
#
# 예전에는 앞의 것 하나뿐이라 **글자가 아니라 시간만** 봤다. 두 글자짜리 '벨레'가
# 1.4초 떠 있으면 깜빡이지 않는다는 이유로 절대 안 합쳐졌고, 실측 회차에서 7자 이하
# 큐가 489장(35%)이었다. 지금은 318장(24%)이다.
#
# 넓히면 앞 발화의 자막이 뒤 발화가 시작될 때까지 남는다. 답답하면 여기를 **줄여라**.
#   merge_gap = 0.4

# ── 조판 정리 ───────────────────────────────────────────────────────
# 영화 자막 관행으로 문장부호를 다듬는다(D30). **기본으로 켜져 있다.**
# 온점 삭제(숫자 사이는 예외) · `...` → `…` · 중복 부호 축약 · 부호 앞뒤 공백 정리 ·
# 큐 끝 쉼표 제거. 물음표·느낌표·문장 중간 쉼표는 **유지한다** — 뜻이 다르다.
#
# **글자는 한 자도 못 지운다.** 지우는 것은 아래 집합에 든 부호뿐이고, 정리 결과가
# 비면 원문을 그대로 되돌린다(규칙 9). 시각도 안 건드린다.
# 골격에는 부호가 살아 있는 원문이 남으므로 `vlogsrt redo <trace> --no-polish`로
# 언제든 부호 있는 판본을 다시 뽑을 수 있다.
#
# **덮어쓸 때는 배열 형식을 써라.** 문자열은 쉼표로 쪼개져서 `polish_trailing_drop = ","`가
# 빈 튜플이 된다. `polish_trailing_drop = [",", "、"]`가 옳다.
#   polish_enabled = true
#   polish_drop_marks = [".", "。"]           # 지운다. **숫자 사이는 예외**
#   polish_collapse_marks = ["!", "?", "…", ","]  # 연속을 하나로
#   polish_trailing_drop = [",", "、"]         # 큐 **끝**에서만 지운다
#   polish_tight_marks = [",", "!", "?", "…"]  # 앞에 공백을 두지 않는다
#   polish_ellipsis = "…"
