# 프로젝트 기본 설정. 프리셋과 CLI 옵션이 이 값을 덮어쓴다.
# 여기 없는 키는 vlogsrt/config.py 의 Config 기본값을 그대로 쓴다.

[transcribe]
language = "ko"
extra_languages = ["ko", "en"]

# 힌트는 회차마다 다르다. 화면에서 실행할 때마다 입력할 수 있으니 여기서는 비워둔다.
# 넣는다면 지시문이 아니라 **나올 법한 단어**를 적어라. 예: "망원동, 아페로, 코나"
# 메타 지시("브이로그 내레이션입니다…")를 넣었다가 모델이 그 문장을 570초 동안
# 103회 되풀이한 적이 있다(D13). 특히 transcribe_model을 whisper-1로 되돌린
# 경우에는 반드시 비워둬라 — whisper는 prompt를 직전 자막 텍스트로 읽는다(D16).
prompt = ""

# 모델과 응답 형식은 여기서 바꾼다. 세그먼트 시각을 주는 조합이어야 한다(D21).
# diarize 모델은 chunking_strategy가 **필수**이고(기본 "auto"), whisper-1은 이
# 인자를 모른다 — 되돌릴 때는 세 줄을 함께 바꿔야 한다(D22).
#   transcribe_model = "whisper-1"
#   transcribe_format = "verbose_json"
#   chunking_strategy = ""

[refine]
max_chars_per_line = 16
max_lines = 2
max_cps = 12.0
