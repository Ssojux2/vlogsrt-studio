# 프로젝트 기본 설정. 프리셋과 CLI 옵션이 이 값을 덮어쓴다.
# 여기 없는 키는 vlogsrt/config.py 의 Config 기본값을 그대로 쓴다.

[transcribe]
language = "ko"
extra_languages = ["ko", "en"]

# prompt는 비워둔다. whisper는 이 값을 **지시문이 아니라 직전 자막 텍스트로** 보고
# 이어 쓴다. 여기에 "브이로그 내레이션입니다. 구어체 한국어이며 …" 같은 메타 지시를
# 넣었더니 whisper가 그 문장을 570초 동안 103회 되풀이했다(D13).
# 넣어야 한다면 지시가 아니라 **나올 법한 단어**를 적어라. 예: "망원동, 아페로, 코나"
# 화면에서 실행할 때마다 입력할 수 있으니 여기서는 비워두는 편이 안전하다.
prompt = ""

[refine]
max_chars_per_line = 16
max_lines = 2
max_cps = 12.0
