# 프로젝트 기본 설정. 프리셋과 CLI 옵션이 이 값을 덮어쓴다.
# 여기 없는 키는 vlogsrt/config.py 의 Config 기본값을 그대로 쓴다.

[transcribe]
language = "ko"

# `extra_languages`를 채우면 복수형 `languages`로 나간다. 이 모델은 그 인자를
# 거부한다(실측 400, D23) — 비워두면 단수형 `language`가 나간다. 되살리지 마라.
extra_languages = []

# 힌트는 회차마다 다르다. 화면에서 실행할 때마다 입력할 수 있으니 여기서는 비워둔다.
# 넣는다면 지시문이 아니라 **나올 법한 단어**를 적어라. 예: "망원동, 아페로, 코나"
# 메타 지시("브이로그 내레이션입니다…")를 넣었다가 모델이 그 문장을 570초 동안
# 103회 되풀이한 적이 있다(D13, D16).
prompt = ""

# 모델은 **글자만** 만든다. 시각은 오디오에서 오므로(D24) 타임스탬프 지원 여부를
# 볼 필요가 없다. 응답에 `text`만 있으면 어떤 모델이든 된다.
#   transcribe_model = "gpt-4o-transcribe"
#   transcribe_format = "json"

# ── 타이밍 ──────────────────────────────────────────────────────────
# 자막이 소리와 어긋나면 **모델이 아니라 이 넷을 만진다.** 넷 다 외부 근거가 없는
# 조정 대상이다(D24). `vlogsrt probe <video>`로 API 없이 결과를 미리 볼 수 있다.
#
#   silence_threshold_db = -30.0   # 소음이 깔려 무음이 안 잡힐 때 올린다. 기본 -35.0
#   silence_min_duration = 0.25    # 발화 구간을 더 잘게 나눈다. 기본 0.3
#   min_speech_duration  = 0.2     # 이보다 짧은 소리는 잡음으로 본다. 기본 0.15
#   batch_max_seconds    = 25.0    # 요청은 늘지만 배분 오차가 준다. 기본 40.0

[refine]
max_chars_per_line = 16
max_lines = 2
max_cps = 12.0
